<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradBride" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#DEE5ED"/>
    </linearGradient>

    <linearGradient id="silverGradBride" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="35%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#7B8C9F"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="bridalRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C1D2E"/>
      <stop offset="45%" stop-color="#731422"/>
      <stop offset="85%" stop-color="#540C16"/>
      <stop offset="100%" stop-color="#3D080F"/>
    </linearGradient>

    <linearGradient id="veilSheerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A12638" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#66101D" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Clip Path for circular avatar -->
    <clipPath id="avatarClipBride">
      <circle cx="120" cy="120" r="112"/>
    </clipPath>
  </defs>

  <!-- Circular Outer Medallion Border in Silver -->
  <circle cx="120" cy="120" r="118" fill="none" stroke="url(#silverGradBride)" stroke-width="2.5"/>
  <circle cx="120" cy="120" r="115" fill="none" stroke="#94A3B8" stroke-width="0.75" stroke-dasharray="2 3"/>
  <circle cx="120" cy="120" r="112" fill="url(#bgGradBride)"/>

  <!-- Content Clustered Inside Circle -->
  <g clip-path="url(#avatarClipBride)">
    <!-- Subtle Background Arabesque Pattern in Silver -->
    <g opacity="0.18" stroke="#7B8C9F" fill="none" stroke-width="1">
      <circle cx="120" cy="120" r="85"/>
      <circle cx="120" cy="120" r="60"/>
      <path d="M120 35 L120 205 M35 120 L205 120 M60 60 L180 180 M60 180 L180 60"/>
      <rect x="75" y="75" width="90" height="90" transform="rotate(0 120 120)"/>
      <rect x="75" y="75" width="90" height="90" transform="rotate(45 120 120)"/>
    </g>

    <!-- Bridal Dupatta / Veil Background Layer (behind shoulders) -->
    <path d="M70 70 C70 42 170 42 170 70 C185 105 192 155 194 240 L46 240 C48 155 55 105 70 70 Z" fill="#4B0B14"/>

    <!-- Bridal Dress / Lehenga Blouse / Shoulders -->
    <path d="M44 240 C46 195 72 175 102 170 L120 170 L138 170 C168 175 194 195 196 240 Z" fill="url(#bridalRedGrad)"/>
    
    <!-- Silver Zari Embroidery on Dress Shoulders -->
    <path d="M48 240 C52 205 76 186 102 176" fill="none" stroke="url(#silverGradBride)" stroke-width="2" opacity="0.85"/>
    <path d="M192 240 C188 205 164 186 138 176" fill="none" stroke="url(#silverGradBride)" stroke-width="2" opacity="0.85"/>
    <!-- Silver floral motifs on shoulders -->
    <circle cx="70" cy="210" r="2.5" fill="#E2E8F0"/>
    <circle cx="64" cy="225" r="2" fill="#E2E8F0"/>
    <circle cx="170" cy="210" r="2.5" fill="#E2E8F0"/>
    <circle cx="176" cy="225" r="2" fill="#E2E8F0"/>

    <!-- Neck -->
    <path d="M109 152 L109 130 C109 130 114 136 120 136 C126 136 131 130 131 130 L131 152 Z" fill="#E5C7AE"/>
    <path d="M110 130 C115 135 125 135 130 130 C125 133 115 133 110 130 Z" fill="#CCA88F"/>

    <!-- Face / Head Base -->
    <path d="M102 96 C102 126 110 136 120 136 C130 136 138 126 138 96 C138 78 131 76 120 76 C109 76 102 78 102 96 Z" fill="#ECD0BA"/>

    <!-- Soft Bridal Blush -->
    <circle cx="109" cy="112" r="5" fill="#D97A82" opacity="0.25"/>
    <circle cx="131" cy="112" r="5" fill="#D97A82" opacity="0.25"/>

    <!-- Bridal Downcast Serene Eyes & Kohl -->
    <path d="M106 94 C109 91 113 91 116 93" fill="none" stroke="#2B1A1E" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M134 94 C131 91 127 91 124 93" fill="none" stroke="#2B1A1E" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M107 98 C110 102 114 102 116 98" fill="none" stroke="#1F1215" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M116 98 L118 97" stroke="#1F1215" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M133 98 C130 102 126 102 124 98" fill="none" stroke="#1F1215" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M124 98 L122 97" stroke="#1F1215" stroke-width="1.4" stroke-linecap="round"/>
    
    <!-- Nose bridge and delicate tip -->
    <path d="M120 93 L120 105 C119 106 121 106 120 105" fill="none" stroke="#CCA88F" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Traditional Bridal Nath in Silver (Nose Ring with Pearl & Chain) -->
    <circle cx="116" cy="106" r="3.2" fill="none" stroke="url(#silverGradBride)" stroke-width="1.1"/>
    <circle cx="114" cy="108" r="1" fill="#FFFFFF"/>
    <!-- Delicate silver chain to hairline -->
    <path d="M114 105 C110 103 105 101 103 97" fill="none" stroke="#94A3B8" stroke-width="0.75" stroke-dasharray="1 1.5"/>

    <!-- Graceful Lips (Soft berry rose) -->
    <path d="M115 117 C117 116 120 117 120 117 C120 117 123 116 125 117 C123 120 117 120 115 117 Z" fill="#B03E50"/>

    <!-- ================= BRIDAL HIJAB / DUPATTA ================= -->
    <!-- Inner Hijab drape -->
    <path d="M102 85 C108 79 132 79 138 85 C132 82 108 82 102 85 Z" fill="#580C16"/>

    <!-- Main Outer Bridal Dupatta / Veil Drape around head -->
    <path d="M82 82 C82 52 98 44 120 44 C142 44 158 52 158 82 C158 116 148 148 144 172 C138 170 134 166 132 155 C132 140 138 116 138 94 C138 78 131 73 120 73 C109 73 102 78 102 94 C102 116 108 140 108 155 C106 166 102 170 96 172 C92 148 82 116 82 82 Z" fill="url(#veilSheerGrad)"/>

    <!-- Silver Scalloped Zari Border Framing Face -->
    <path d="M102 94 C102 78 109 73 120 73 C131 73 138 78 138 94 C138 115 133 138 133 154" fill="none" stroke="url(#silverGradBride)" stroke-width="2.5"/>
    <path d="M102 94 C102 115 107 138 107 154" fill="none" stroke="url(#silverGradBride)" stroke-width="2.5"/>

    <!-- Silver Scallop Dots along inner veil border -->
    <g fill="#F1F5F9" opacity="0.95">
      <circle cx="103" cy="85" r="1.3"/>
      <circle cx="108" cy="78" r="1.3"/>
      <circle cx="114" cy="74" r="1.3"/>
      <circle cx="120" cy="73" r="1.4"/>
      <circle cx="126" cy="74" r="1.3"/>
      <circle cx="132" cy="78" r="1.3"/>
      <circle cx="137" cy="85" r="1.3"/>
      <circle cx="138" cy="95" r="1.3"/>
      <circle cx="137" cy="107" r="1.3"/>
      <circle cx="135" cy="119" r="1.3"/>
      <circle cx="134" cy="131" r="1.3"/>
      <circle cx="102" cy="95" r="1.3"/>
      <circle cx="103" cy="107" r="1.3"/>
      <circle cx="105" cy="119" r="1.3"/>
      <circle cx="106" cy="131" r="1.3"/>
    </g>

    <!-- Outer Veil Border Silver Lace -->
    <path d="M82 82 C82 52 98 44 120 44 C142 44 158 52 158 82 C158 116 148 148 144 172" fill="none" stroke="url(#silverGradBride)" stroke-width="1.8"/>
    <path d="M82 82 C82 116 92 148 96 172" fill="none" stroke="url(#silverGradBride)" stroke-width="1.8"/>

    <!-- Dupatta Folds across chest & shoulders -->
    <path d="M96 172 C106 178 134 178 144 172 C148 185 152 205 156 240 L84 240 C88 205 92 185 96 172 Z" fill="#66101D"/>
    <path d="M96 172 C110 182 130 182 144 172" fill="none" stroke="url(#silverGradBride)" stroke-width="2"/>

    <!-- Ornate Veil Motifs (Silver Sequins / Butis) -->
    <g fill="#CBD5E1" opacity="0.85">
      <circle cx="92" cy="72" r="1.5"/><circle cx="90" cy="95" r="1.5"/><circle cx="89" cy="120" r="1.5"/>
      <circle cx="148" cy="72" r="1.5"/><circle cx="150" cy="95" r="1.5"/><circle cx="151" cy="120" r="1.5"/>
      <circle cx="105" cy="55" r="1.5"/><circle cx="135" cy="55" r="1.5"/>
    </g>

    <!-- ================= BRIDAL JEWELRY IN PLATINUM & SILVER ================= -->
    <!-- Matha Patti / Maang Tikka (Forehead Jewelry) -->
    <path d="M103 82 C110 78 120 78 120 78 C120 78 130 78 137 82" fill="none" stroke="url(#silverGradBride)" stroke-width="1.5"/>
    <path d="M103 84 C110 80 120 80 120 80 C120 80 130 80 137 84" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="1.5 2"/>
    <!-- Center Chain down parting -->
    <path d="M120 62 L120 78" stroke="url(#silverGradBride)" stroke-width="1.5"/>
    <!-- Maang Tikka Center Pendant -->
    <circle cx="120" cy="82" r="3.5" fill="url(#silverGradBride)"/>
    <circle cx="120" cy="82" r="1.8" fill="#6E111E"/>
    <!-- Dangling pearl teardrop -->
    <path d="M119 86 C119 85 121 85 121 86 L121.5 88 C121.5 89 118.5 89 118.5 88 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.5"/>

    <!-- Bridal Choker & Layered Necklaces in Silver -->
    <path d="M110 142 C114 146 126 146 130 142" fill="none" stroke="url(#silverGradBride)" stroke-width="3"/>
    <path d="M110 142 C114 146 126 146 130 142" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="1.5 2"/>
    <!-- Hanging pearls from choker -->
    <circle cx="114" cy="147" r="1.2" fill="#FFFFFF"/>
    <circle cx="117" cy="148" r="1.2" fill="#FFFFFF"/>
    <circle cx="120" cy="148.5" r="1.4" fill="#FFFFFF"/>
    <circle cx="123" cy="148" r="1.2" fill="#FFFFFF"/>
    <circle cx="126" cy="147" r="1.2" fill="#FFFFFF"/>

    <!-- Rani Haar in Silver -->
    <path d="M108 152 C114 163 126 163 132 152" fill="none" stroke="url(#silverGradBride)" stroke-width="2"/>
    <circle cx="120" cy="162" r="3" fill="url(#silverGradBride)"/>
    <circle cx="120" cy="162" r="1.5" fill="#6E111E"/>
    <circle cx="120" cy="167" r="1.5" fill="#FFFFFF"/>

    <!-- Jhumka / Earrings in Silver -->
    <circle cx="99" cy="116" r="2" fill="url(#silverGradBride)"/>
    <path d="M97 119 L101 119 L100 123 L98 123 Z" fill="url(#silverGradBride)"/>
    <circle cx="141" cy="116" r="2" fill="url(#silverGradBride)"/>
    <path d="M139 119 L143 119 L142 123 L140 123 Z" fill="url(#silverGradBride)"/>
  </g>
</svg>
